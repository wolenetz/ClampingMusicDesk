name: Convert PrintingGuide for Printables

on:
  push:
    paths:
      - 'PrintingGuide.md'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Markdown library
        run: pip install markdown

      - name: Convert PrintingGuide.md to Printables HTML
        run: |
          python3 -c '
          import re, markdown

          with open("PrintingGuide.md", "r", encoding="utf-8") as f:
              md_text = f.read()

          # Shift all headings down by 1 level (# -> ##, ## -> ###) so Printables accepts them
          shifted_md = re.sub(r"^(#{1,5})\s+", r"#\1 ", md_text, flags=re.MULTILINE)

          # Convert to clean HTML (supporting tables and fenced code blocks)
          html = markdown.markdown(shifted_md, extensions=["tables", "fenced_code"])

          with open("PrintingGuide-printables.html", "w", encoding="utf-8") as f:
              f.write(html)
          '

      - name: Commit updated Printables HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add PrintingGuide-printables.html
          git diff --staged --quiet || git commit -m "chore: update PrintingGuide-printables.html [skip ci]"
          git push

